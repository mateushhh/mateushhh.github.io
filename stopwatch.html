<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Timer Stopwatch</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

<div id="page">
    <div id="left"></div>
    <div id="main">
        <h1>Multi-Timer Stopwatch</h1>
    
        <!-- Form to add names -->
        <label for="personName">Person Name:</label>
        <input type="text" id="personName" placeholder="Greg">
        <button onclick="addPerson()">Add Person</button>
        
        <!-- Timer display -->
        <div id="timers">
            <div class="timer"></div>
        
        </div>
        
        <!-- Button to save results -->
        <button onclick="saveResults()">Save Results</button></div>
    <div id="right"></div>
</div>

<script src="./script.js"></script>
</body>
</html>
