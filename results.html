<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results & Standings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>CCRC</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Calendar</a></li>
                <li><a href="results.html" class="active">Results & Standings</a></li>
                <li><a href="teams.html">Teams & Drivers</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="results-section">
            <h2>2025 Championship Standings</h2>
            
            <div class="tabs">
                <button class="tab-button active" onclick="openTab('drivers')">Drivers</button>
                <button class="tab-button " onclick="openTab('teams')">Teams</button>
            </div>
            
            <div id="results-filter">
                <label><input type="radio" name="resultType" value="overall" checked> Overall</label>
                <label><input type="radio" name="resultType" value="SS1"> 1</label>
                <label><input type="radio" name="resultType" value="SS2"> 2</label>
                <label><input type="radio" name="resultType" value="SS3"> 3</label>
                <label><input type="radio" name="resultType" value="SS4"> 4</label>
                <label><input type="radio" name="resultType" value="SS5"> 5</label>
                <label><input type="radio" name="resultType" value="SS6"> 6</label>
                <label><input type="radio" name="resultType" value="SS7"> 7</label>
                <label><input type="radio" name="resultType" value="SS8"> 8</label>
                <label><input type="radio" name="resultType" value="SS9"> 9</label>
                <label><input type="radio" name="resultType" value="SS10"> 10</label>
                <label><input type="radio" name="resultType" value="SS11"> 11</label>
                <label><input type="radio" name="resultType" value="SS12"> 12</label>
            </div>
            
            <div id="drivers" class="tab-content active-tab">
                <table id="drivers-standings">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Driver</th>
                            <th>Team</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here from Sheets API -->
                    </tbody>
                </table>
            </div>
            
            <div id="teams" class="tab-content">
                <table id="teams-standings">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Team</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here from Sheets API -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>2025 Car Cult Rally Championship</p>
        <p>&copy; mateushhh</p>
    </footer>

    <script src="js/results.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
